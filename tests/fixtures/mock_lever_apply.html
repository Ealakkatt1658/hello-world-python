<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mock Lever - Apply</title>
<style>body { font-family: sans-serif; margin: 20px; } li { list-style: none; margin: 8px 0; } .application-question input[type=radio], .application-question input[type=checkbox] { opacity: 0; position: absolute; }</style>
</head>
<body>
<div class="posting-headline"><h2>Data Engineering Intern</h2></div>
<form id="application-form" action="/mockco/123/apply" method="post" onsubmit="return false">
  <h4>Submit your application</h4>
  <ul>
    <li class="application-question resume">
      <label><div class="application-label">Resume/CV<span class="required">✱</span></div>
      <div class="application-field"><input type="file" name="resume" id="resume-upload-input"></div></label>
    </li>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
      <div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
      <div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div>
      <div class="application-field"><input type="text" name="phone"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current location</div>
      <div class="application-field"><input type="text" name="location"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div>
      <div class="application-field"><input type="text" name="org"></div></label></li>
  </ul>
  <h4>Links</h4>
  <ul>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
      <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div>
      <div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
  </ul>
  <ul>
    <li class="application-question custom-question">
      <div class="application-label"><div class="text">Are you authorized to work in the US without sponsorship?<span class="required">✱</span></div></div>
      <div class="application-field"><ul data-qa="multiple-choice">
        <li><label><input type="radio" name="cards[a][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
        <li><label><input type="radio" name="cards[a][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
      </ul></div>
    </li>
    <li class="application-question custom-question">
      <div class="application-label"><div class="text">Which of these languages do you know?</div></div>
      <div class="application-field"><ul data-qa="checkboxes">
        <li><label><input type="checkbox" name="cards[b][field0]" value="Python"><span class="application-answer-alternative">Python</span></label></li>
        <li><label><input type="checkbox" name="cards[b][field0]" value="Go"><span class="application-answer-alternative">Go</span></label></li>
        <li><label><input type="checkbox" name="cards[b][field0]" value="SQL"><span class="application-answer-alternative">SQL</span></label></li>
      </ul></div>
    </li>
    <li class="application-question custom-question">
      <div class="application-label"><div class="text">Additional information</div></div>
      <div class="application-field"><textarea name="comments"></textarea></div>
    </li>
  </ul>
  <h4>U.S. Equal Employment Opportunity information</h4>
  <ul>
    <li class="application-question"><div class="application-label">Gender</div>
      <select name="eeo[gender]"><option value="">Select ...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></li>
    <li class="application-question"><div class="application-label">Race</div>
      <select name="eeo[race]"><option value="">Select ...</option><option>Hispanic or Latino</option><option>Asian (Not Hispanic or Latino)</option><option>White (Not Hispanic or Latino)</option><option>Decline to self-identify</option></select></li>
    <li class="application-question"><div class="application-label">Veteran status</div>
      <select name="eeo[veteran]"><option value="">Select ...</option><option>I am a veteran</option><option>I am not a veteran</option><option>Decline to self-identify</option></select></li>
    <li class="application-question"><div class="application-label">Disability status</div>
      <select name="eeo[disability]"><option value="">Select ...</option><option>Yes, I have a disability (or previously had a disability)</option><option>No, I do not have a disability</option><option>I do not want to answer</option></select></li>
  </ul>
  <div class="application-question">
    <label><input type="checkbox" name="consent[store]" required> I agree to Lever's privacy policy and consent to my data being stored.</label>
  </div>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
<script>
document.getElementById('btn-submit').onclick = () => {
  const form = document.getElementById('application-form');
  if (!form.checkValidity()) { form.appendChild(Object.assign(document.createElement('div'), {className: 'error-message', textContent: 'Please fill in required fields'})); return; }
  const data = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'file') data[el.name] = el.files.length ? el.files[0].name : '';
    else if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) data[el.name] = data[el.name] ? data[el.name] + '; ' + el.value : (el.type === 'checkbox' && el.value === 'on' ? true : el.value); }
    else data[el.name] = el.value;
  }
  window.__submitted = data;
  document.body.innerHTML = '<h2>Application submitted!</h2><p>Thanks for applying.</p>';
};
</script>
</body>
</html>
