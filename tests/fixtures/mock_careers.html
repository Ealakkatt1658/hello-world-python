<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Example Corp Careers</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  .field { margin: 8px 0; }
  [role=radio] { display: inline-block; border: 1px solid #999; padding: 2px 8px; cursor: pointer; }
  [role=radio][aria-checked=true], .yn button.active { background: #9cf; }
</style>
</head>
<body>
<header>
  <a href="/">Example Corp</a>
  <form role="search"><input type="text" placeholder="Search jobs" aria-label="Search jobs"> <input type="text" aria-label="Location"></form>
  <a href="/jobs">Apply</a>
</header>
<main id="app"></main>
<footer><a href="/privacy">Privacy</a></footer>
<script>
// One page that renders each step of an imaginary careers site based on the URL path.
const app = document.getElementById('app');
const path = location.pathname;
const store = (k, v) => v === undefined ? JSON.parse(localStorage.getItem(k) || 'null') : localStorage.setItem(k, JSON.stringify(v));
const data = () => store('application') || {};
const save = (obj) => store('application', Object.assign(data(), obj));
const go = (p) => { location.href = p; };
const error = (msg) => { document.querySelectorAll('.err').forEach(e => e.remove()); app.insertAdjacentHTML('beforeend', `<div class="err" role="alert">${msg}</div>`); };
const val = (id) => document.getElementById(id).value;

if (path === '/jobs/42') {
  app.innerHTML = `
    <h1>Marketing Analyst Intern</h1>
    <div class="job-description"><p>Example Corp is hiring a marketing analyst intern for summer 2027. You will analyse campaign
    data in SQL and Excel, build dashboards, and present findings to the marketing leadership team. Students in
    business, statistics or computer science are encouraged to apply. Thank you for your interest in Example Corp.</p></div>
    <a class="btn" href="/jobs/42/apply">Apply Now</a>
    <section><h3>Get job alerts</h3><input type="email" placeholder="Your email"> <button>Subscribe</button></section>`;
} else if (path === '/jobs/42/apply') {
  app.innerHTML = `
    <h2>Sign in to apply</h2>
    <form id="login" onsubmit="return false">
      <div class="field"><label for="u">Email</label><input id="u" type="email" name="username"></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password"></div>
      <label><input type="checkbox"> Remember me</label>
      <button type="submit">Sign In</button>
    </form>
    <p><button type="button" onclick="alert('nope')">Continue with Google</button></p>
    <p><a href="/register">Create an account</a></p>`;
  document.getElementById('login').onsubmit = () => {
    const acct = (store('accounts') || {})[val('u')];
    if (acct && acct.password === val('p')) { go('/jobs/42/apply/1'); } else { error('Invalid email or password.'); }
    return false;
  };
} else if (path === '/register') {
  app.innerHTML = `
    <h2>Create your candidate account</h2>
    <form id="reg" onsubmit="return false">
      <div class="field"><label for="fn">First name</label><input id="fn" required></div>
      <div class="field"><label for="ln">Last name</label><input id="ln" required></div>
      <div class="field"><label for="em">Email address</label><input id="em" type="email" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" required></div>
      <div class="field"><label for="pw2">Confirm password</label><input id="pw2" type="password" required></div>
      <div class="field"><input id="tos" type="checkbox" required><label for="tos">I agree to the Terms of Use</label></div>
      <button type="submit">Create Account</button>
    </form>`;
  document.getElementById('reg').onsubmit = () => {
    if (!document.getElementById('reg').checkValidity()) return error('Please complete all fields.');
    if (val('pw') !== val('pw2')) return error('Passwords do not match.');
    const accounts = store('accounts') || {};
    accounts[val('em')] = { password: val('pw'), first: val('fn'), last: val('ln') };
    store('accounts', accounts);
    go('/jobs/42/apply');  // this site sends you back to sign in
    return false;
  };
} else if (path === '/jobs/42/apply/1') {
  app.innerHTML = `
    <h2>Step 1 of 3: Your details</h2>
    <form id="s1" onsubmit="return false">
      <div class="field"><label for="first">First Name *</label><input id="first" required></div>
      <div class="field"><label for="last">Last Name *</label><input id="last" required></div>
      <div class="field"><label for="email">Email *</label><input id="email" type="email" required></div>
      <div class="field"><input id="phone" type="tel" aria-label="Mobile phone number" required></div>
      <div class="field"><label for="country">Country</label><select id="country"><option value="">Please select</option><option>Canada</option><option>United States</option></select></div>
      <div class="field"><input id="linkedin" placeholder="LinkedIn profile URL"></div>
      <button type="button" onclick="history.back()">Back</button>
      <button type="submit">Next</button>
    </form>`;
  document.getElementById('s1').onsubmit = () => {
    if (!document.getElementById('s1').checkValidity()) return error('Please fill in the required fields.');
    save({ first: val('first'), last: val('last'), email: val('email'), phone: val('phone'), country: val('country'), linkedin: val('linkedin') });
    go('/jobs/42/apply/2');
    return false;
  };
} else if (path === '/jobs/42/apply/2') {
  app.innerHTML = `
    <h2>Step 2 of 3: Questions</h2>
    <div class="field"><span id="auth-q">Are you legally authorized to work in the United States? *</span>
      <div role="radiogroup" aria-labelledby="auth-q" aria-required="true">
        <div role="radio" aria-checked="false" tabindex="0">Yes</div><div role="radio" aria-checked="false" tabindex="0">No</div>
      </div></div>
    <div class="field"><div class="question-title">Will you now or in the future require visa sponsorship?</div>
      <div class="yn"><button type="button">Yes</button><button type="button">No</button></div></div>
    <div class="field"><label for="why">Why are you interested in this role? *</label><textarea id="why" required></textarea></div>
    <div class="field"><label for="cv">Upload your resume</label><input id="cv" type="file"><span id="cvname"></span></div>
    <button type="button" id="cont">Continue</button>`;
  document.querySelectorAll('[role=radio]').forEach(r => r.onclick = () => {
    document.querySelectorAll('[role=radio]').forEach(x => x.setAttribute('aria-checked', String(x === r)));
  });
  document.querySelectorAll('.yn button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.yn button').forEach(x => x.classList.toggle('active', x === b));
  });
  document.getElementById('cv').onchange = (e) => { document.getElementById('cvname').textContent = e.target.files[0].name; };
  document.getElementById('cont').onclick = () => {
    const auth = document.querySelector('[role=radio][aria-checked=true]');
    const spons = document.querySelector('.yn button.active');
    const cv = document.getElementById('cv').files[0];
    if (!auth || !spons || !val('why') || !cv) return error('Please answer every question and attach your resume.');
    save({ authorized: auth.textContent, sponsorship: spons.textContent, why: val('why'), resume: cv.name });
    go('/jobs/42/apply/3');
  };
} else if (path === '/jobs/42/apply/3') {
  const d = data();
  app.innerHTML = `
    <h2>Step 3 of 3: Review</h2>
    <p>${d.first} ${d.last} &middot; ${d.email}</p>
    <form id="s3" onsubmit="return false"><button type="submit">Submit Application</button></form>`;
  document.getElementById('s3').onsubmit = () => { save({ submitted: true }); go('/jobs/42/done'); return false; };
} else if (path === '/jobs/42/done') {
  app.innerHTML = '<h2>Thank you!</h2><p>Your application has been submitted.</p>';
}
</script>
</body>
</html>
