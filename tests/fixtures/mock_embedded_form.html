<!doctype html>
<html><head><meta charset="utf-8"><title>Apply</title></head>
<body>
<form id="f" onsubmit="return false">
  <p><label>Full name <input name="full" required></label></p>
  <p><label>Email <input name="email" type="email" required></label></p>
  <p><label>Phone <input name="phone"></label></p>
  <p><label>Resume / CV <input name="resume" type="file"></label></p>
  <button type="submit">Apply</button>
</form>
<script>
document.getElementById('f').onsubmit = () => {
  const f = document.getElementById('f');
  if (!f.checkValidity()) return false;
  window.__submitted = { full: f.full.value, email: f.email.value, phone: f.phone.value, resume: f.resume.files.length ? f.resume.files[0].name : '' };
  document.body.innerHTML = '<p>Thanks for applying! We received your application.</p>';
  return false;
};
</script>
</body></html>
